services:
  node:
    image: node:latest
    build: ./src/node
    ports:
      - 3001:3001
    restart: always


  php:
    image: php:latest
    build: ./src/php
    ports:
      - 8080:80
    restart: always

  lua:
    build: .
    ports:
      - 3002:3002
    restart: always
    command: lua main.lua

  java:
    image: openjdk:8-jdk-alpine
    volumes:
      - ./java:/app/java
    ports:
      - "3003:3000"
    working_dir: /app/java
    command: java -jar main.jar

  python:
    build: ./src/python
    image: python:latest
    ports:
      - 8082:8082
    restart: always 