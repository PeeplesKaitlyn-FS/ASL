services:
  node:
    image: node:latest
    build: ./src/node
    ports:
      - 3001:3001
    restart: always


  php:
    image: php:latest
    build: ./src/php
    ports:
      - 8080:80
    restart: always
    command: php -S 0.0.0.0:80

  lua:
    build: .
    ports:
      - "3002:3002"
    restart: always
    command: lua5.4 main.lua

  java:
    image: openjdk:8-jdk-alpine
    volumes:
      - ./src/java:/app/java
    ports:
      - "3003:3000"
    working_dir: /app/java
    command: java Main
    
  python:
    build: ./src/python
    image: python:latest
    ports:
      - 8082:8082
    restart: always 